id: bluetooth-flow
start_node: scan
nodes:
  - id: scan
    type: bluetooth
    config:
      timeout_seconds: 15
    transitions:
      success: find
      failure: stop
  - id: find
    type: lookup
    config:
      source: devices
      field: name
      pattern: "BLE Harness"
      match: exact
      mode: first
    transitions:
      success: show
      failure: stop
  - id: show
    type: console
    config: {}
    transitions:
      success: stop
      failure: stop
  - id: stop
    type: noop
    config: {}
