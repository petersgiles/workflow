id: branch-flow
start_node: onecheck
nodes:
  - id: onecheck
    type: branch
    config:
      expr: "1 == 1"
    transitions:
      true: onecheck_success
      false: onecheck_fail
  - id: onecheck_success
    type: branch
    config:
      expr: "2 == 1"
    transitions:
      true: onecheck_success_success
      false: onecheck_success_fail
  - id: onecheck_success_success
    type: noop
    config: {}
  - id: onecheck_success_fail
    type: noop
    config: {}
  - id: onecheck_fail
    type: noop
    config: {}
